name: Career checks

on:
  pull_request:
    branches: [master]
    paths:
      - "lib/career/**"
      - "app/api/career/**"
      - "app/dashboard/careers/**"
      - "app/api/mcp/route.ts"
      - ".github/workflows/career-checks.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint career changes
        run: npx eslint lib/career app/api/career app/dashboard/careers app/api/mcp/route.ts
      - name: Production build
        run: npm run build

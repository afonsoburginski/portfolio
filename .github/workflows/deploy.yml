name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/workflows/dokploy-provision.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: afonsoburginski/portfolio
  # Deploy pelo Orbit (orbit.afonsodev.com, ambiente portfolio na VM Hetzner): o CI publica a imagem com a tag do
  # commit e chama o gancho de deploy, que fixa essa tag, sobe o web e volta à anterior se ele não ficar saudável.
  ORBIT_URL: ${{ vars.ORBIT_URL }}
  HEALTH_URL: "https://afonsodev.com/api/health"

jobs:
  build:
    name: Build & Push · web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio
          build-args: |
            NEXT_PUBLIC_APP_URL=https://afonsodev.com
            NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY }}

  deploy:
    name: Deploy · Orbit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      # A Cloudflare corta pedidos acima de 100 s: o gancho responde 202 na hora e o job acompanha o status.
      - name: Entregar pelo Orbit
        env:
          ORBIT_DEPLOY_TOKEN: ${{ secrets.ORBIT_DEPLOY_TOKEN }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          [ -n "$ORBIT_URL" ] && [ -n "$ORBIT_DEPLOY_TOKEN" ] || { echo "::error::defina a variável ORBIT_URL e o secret ORBIT_DEPLOY_TOKEN"; exit 1; }
          body=$(jq -cn --arg tag "$TAG" '{environment: "portfolio", services: [{service: "web", tag: $tag}]}')
          response=$(curl -sS --max-time 60 -w '\n%{http_code}' -X POST "$ORBIT_URL/api/hooks/deploy?wait=false" \
            -H "Authorization: Bearer $ORBIT_DEPLOY_TOKEN" -H 'Content-Type: application/json' -d "$body")
          code=$(tail -n1 <<<"$response"); response=$(sed '$d' <<<"$response")
          [ "$code" = 202 ] || [ "$code" = 200 ] || { echo "::error::Orbit recusou ($code): $(jq -r '.error // .' <<<"$response")"; exit 1; }
          id=$(jq -r .id <<<"$response")
          for attempt in $(seq 1 120); do
            response=$(curl -sS --max-time 30 -w '\n%{http_code}' "$ORBIT_URL/api/hooks/deploy/$id" -H "Authorization: Bearer $ORBIT_DEPLOY_TOKEN" || printf '\n000')
            code=$(tail -n1 <<<"$response"); response=$(sed '$d' <<<"$response")
            if [ "$code" = 202 ] || [ "$code" = 000 ]; then sleep 5; continue; fi
            if [ "$code" = 200 ] && [ "$(jq -r .state <<<"$response")" = ok ]; then echo "✓ Orbit entregou web → $TAG"; exit 0; fi
            echo "::error::Orbit não entregou ($code): $(jq -r '.error // .' <<<"$response")"; exit 1
          done
          echo "::error::Orbit não terminou em 10 min (deploy $id)"; exit 1

      - name: Checar saúde pública (via Cloudflare)
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$HEALTH_URL" || true)
            echo "tentativa $i: /api/health -> $code"
            [ "$code" = "200" ] && echo "✅ Portfolio no ar" && exit 0
            sleep 15
          done
          echo "::error::/api/health não respondeu 200 a tempo"
          exit 1
